name: Hourly Website Status Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Website
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://proprankdigital.com)
          echo "Website responded with status code: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Success: Website is up and running normally (200 OK)."
          else
            echo "Error: Website returned status code $STATUS"
            exit 1
          fi
